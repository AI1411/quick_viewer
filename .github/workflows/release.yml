name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS (aarch64)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate changelog
        id: git-cliff
        run: |
          CHANGELOG=$(npx --yes --package git-cliff@latest git-cliff --latest --config cliff.toml)
          {
            echo "content<<GITCLIFF_EOF"
            echo "$CHANGELOG"
            echo "GITCLIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: macOS code signing (skip if secrets are not set)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: QuickView ${{ github.ref_name }}
          releaseBody: |
            ## QuickView ${{ github.ref_name }}

            ${{ steps.git-cliff.outputs.content }}

            ### インストール方法
            1. `QuickView_*_aarch64.dmg` をダウンロード
            2. DMG を開いてアプリを `/Applications` にドラッグ
            3. 初回起動時に Gatekeeper の確認が出る場合は「開く」を選択
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
