[package]
name = "tauri-app"
version = "2.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chardetng = "0.1"
encoding_rs = "0.8"
notify = "6"
csv = "1"
regex = "1"
lopdf = "0.32"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde_yaml = "0.9"
calamine = { version = "0.24", features = ["dates"] }
chrono = "0.4"
zip = "2"
quick-xml = "0.37"
sha2 = "0.10"
ammonia = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = "0.3.2"
webp = { version = "0.3.1", default-features = false }

# libwebp は最適化なしだと大きな画像の WebP 変換に数十秒かかるため、開発ビルドでも最適化する
[profile.dev.package.libwebp-sys]
opt-level = 3
